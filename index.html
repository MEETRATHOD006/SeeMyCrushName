<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#100d18" />
  <title>A Little Secret 💌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #fff8f4; font-family: 'DM Sans', sans-serif;
      background: radial-gradient(circle at 20% 15%, #43213e 0, transparent 35%),
                  radial-gradient(circle at 85% 85%, #2e244d 0, transparent 38%), #100d18;
      overflow: hidden;
    }
    .glow { position: fixed; width: 260px; height: 260px; border-radius: 50%;
      background: #e76b9c; filter: blur(110px); opacity: .18; pointer-events: none; }
    .glow.one { top: -100px; right: -70px; }
    .glow.two { bottom: -130px; left: -70px; background: #9275ff; }
    .card {
      width: min(100%, 430px); position: relative; text-align: center;
      padding: 48px 32px 38px; border: 1px solid rgba(255,255,255,.13);
      border-radius: 28px; background: rgba(255,255,255,.065);
      box-shadow: 0 24px 90px rgba(0,0,0,.38); backdrop-filter: blur(18px);
    }
    .heart { font-size: 35px; margin-bottom: 18px; filter: drop-shadow(0 0 18px #ed75a8); }
    .eyebrow { color: #e8a8c4; letter-spacing: .22em; text-transform: uppercase;
      font-size: 10px; font-weight: 600; }
    h1 { font: 600 clamp(32px, 8vw, 43px)/1.12 'Playfair Display', serif; margin: 13px 0 12px; }
    p { color: #c8bdca; line-height: 1.65; font-size: 14px; margin: 0 auto 26px; max-width: 300px; }
    .field { display: flex; gap: 9px; flex-direction: column; }
    input {
      width: 100%; border: 1px solid rgba(255,255,255,.17); border-radius: 13px;
      padding: 15px 16px; outline: none; background: rgba(10,8,17,.48);
      color: white; font: inherit; text-align: center; letter-spacing: .12em;
      transition: border .2s, box-shadow .2s;
    }
    input:focus { border-color: #e58bb2; box-shadow: 0 0 0 3px rgba(229,139,178,.13); }
    input::placeholder { color: #827687; letter-spacing: .08em; }
    button {
      border: 0; border-radius: 13px; padding: 15px; cursor: pointer;
      color: #25121e; background: linear-gradient(110deg, #f3b3cb, #e98eae);
      font: 600 14px 'DM Sans', sans-serif; transition: transform .2s, filter .2s;
    }
    button:hover { transform: translateY(-2px); filter: brightness(1.06); }
    #error { min-height: 20px; color: #ff9bad; font-size: 12px; margin: 12px 0 0; }
    #reveal { display: none; animation: appear .65s ease both; }
    .name {
      margin: 20px 0 14px; color: #ffc0d6;
      font: 700 clamp(34px, 9vw, 48px) 'Playfair Display', serif;
      overflow-wrap: anywhere; text-shadow: 0 0 28px rgba(255,145,190,.28);
    }
    .small { color: #a99bad; font-size: 11px; margin-top: 22px; }
    @keyframes appear { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
    @media (max-width: 420px) { .card { padding: 40px 23px 32px; } }
  </style>
</head>
<body>
  <div class="glow one"></div><div class="glow two"></div>
  <main class="card">
    <section id="lock">
      <div class="heart">♡</div>
      <div class="eyebrow">Top secret · Confidential</div>
      <h1>Only Real One Knows!</h1>
      <p>There's a little secret hidden here. If you know the code, you deserve to know. 👀</p>
      <form id="codeForm" class="field">
        <input id="secretCode" type="password" placeholder="Enter the secret code" autocomplete="off" required />
        <button type="submit">Unlock the secret <span aria-hidden="true">→</span></button>
      </form>
      <div id="error" role="status" aria-live="polite"></div>
    </section>

    <section id="reveal">
      <div class="heart">💗</div>
      <div class="eyebrow">The secret is out</div>
      <h1>My crush is...</h1>
      <div class="name" id="crushName">Your Crush's Name</div>
      <p>Now you know. Please keep it between us. 🤫</p>
      <button type="button" onclick="location.reload()">Close secret</button>
    </section>
    <div class="small">Made with a little courage and a lot of ❤️</div>
  </main>
  <script>
    // CUSTOMIZE THESE TWO VALUES:
    const SECRET_CODE = "894034890";
    const CRUSH_NAME = "Your Crush's Name";

    document.getElementById("codeForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const entered = document.getElementById("secretCode").value.trim();
      const error = document.getElementById("error");

      if (entered === SECRET_CODE) {
        document.getElementById("crushName").textContent = CRUSH_NAME;
        document.getElementById("lock").style.display = "none";
        document.getElementById("reveal").style.display = "block";
      } else {
        error.textContent = "Oops! That's not the secret code. Try again 💭";
        document.getElementById("secretCode").value = "";
        document.getElementById("secretCode").focus();
      }
    });
  </script>
</body>
</html>
